<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FreeCall - One Page P2P Calling</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #333;
        }

        .container {
            background: rgba(255,255,255,0.95);
            backdrop-filter: blur(20px);
            border-radius: 25px;
            padding: 30px;
            width: 90%;
            max-width: 500px;
            box-shadow: 0 25px 50px rgba(0,0,0,0.2);
            text-align: center;
        }

        .logo {
            margin-bottom: 30px;
        }

        .logo h1 {
            font-size: 2.5em;
            background: linear-gradient(45deg, #667eea, #764ba2);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 10px;
        }

        .input-group {
            margin-bottom: 20px;
        }

        input {
            width: 100%;
            padding: 15px;
            border: 2px solid #e1e5e9;
            border-radius: 15px;
            font-size: 16px;
            margin-bottom: 15px;
            transition: all 0.3s;
        }

        input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102,126,234,0.1);
        }

        button {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 15px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            margin: 5px 0;
        }

        .btn-primary {
            background: linear-gradient(45deg, #667eea, #764ba2);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 30px rgba(102,126,234,0.4);
        }

        .btn-success { background: #28a745; color: white; }
        .btn-danger { background: #dc3545; color: white; }
        .btn-secondary { 
            background: #f8f9fa; 
            color: #495057; 
            border: 2px solid #e9ecef;
        }

        .call-section {
            display: none;
            margin-top: 20px;
        }

        .call-section.active {
            display: block;
            animation: slideIn 0.4s ease-out;
        }

        @keyframes slideIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .peer-id {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 12px;
            margin: 15px 0;
            font-family: monospace;
            font-size: 14px;
            word-break: break-all;
            border: 2px solid #e9ecef;
        }

        .video-container {
            position: relative;
            height: 250px;
            background: #000;
            border-radius: 15px;
            overflow: hidden;
            margin: 20px 0;
        }

        #localVideo {
            position: absolute;
            bottom: 10px;
            right: 10px;
            width: 120px;
            height: 90px;
            border-radius: 10px;
            border: 3px solid rgba(255,255,255,0.8);
            z-index: 2;
        }

        #remoteVideo {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .call-controls {
            display: flex;
            gap: 12px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .call-controls button {
            width: auto;
            padding: 12px 20px;
            font-size: 14px;
        }

        .status {
            padding: 12px;
            border-radius: 10px;
            margin: 15px 0;
            font-weight: 500;
        }

        .status.connecting { background: #fff3cd; color: #856404; }
        .status.connected { background: #d4edda; color: #155724; }
        .status.error { background: #f8d7da; color: #721c24; }

        @media (max-width: 480px) {
            .container { padding: 20px; margin: 10px; }
            .logo h1 { font-size: 2em; }
            #localVideo { width: 100px; height: 75px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">
            <h1>📞 FreeCall</h1>
            <p>Share Peer ID to call anyone!</p>
        </div>

        <!-- Main Interface -->
        <div id="mainScreen">
            <div class="input-group">
                <input type="text" id="peerIdInput" placeholder="Enter Peer ID to call">
                <button class="btn-primary" onclick="connectCall()">📞 Connect Call</button>
            </div>
            
            <div class="peer-id" id="myPeerId">Generating your Peer ID...</div>
            
            <div class="status connecting" id="status">Initializing peer connection...</div>
        </div>

        <!-- Call Interface -->
        <div id="callScreen" class="call-section">
            <div class="video-container">
                <video id="localVideo" autoplay muted playsinline></video>
                <video id="remoteVideo" autoplay playsinline></video>
            </div>
            
            <div class="call-controls">
                <button class="btn-success" id="muteBtn" onclick="toggleMute()">🔇 Mute</button>
                <button class="btn-secondary" onclick="toggleVideo()">📹 Video</button>
                <button class="btn-danger" onclick="endCall()">📴 End Call</button>
            </div>
            
            <div class="status connected" id="callStatus">🟢 Connected - You can see and hear each other!</div>
        </div>
    </div>

    <script>
        // Global variables
        let peer = null;
        let currentCall = null;
        let localStream = null;
        let isMuted = false;
        let isVideoOn = true;

        // DOM elements
        const mainScreen = document.getElementById('mainScreen');
        const callScreen = document.getElementById('callScreen');
        const peerIdInput = document.getElementById('peerIdInput');
        const myPeerId = document.getElementById('myPeerId');
        const status = document.getElementById('status');
        const localVideo = document.getElementById('localVideo');
        const remoteVideo = document.getElementById('remoteVideo');
        const muteBtn = document.getElementById('muteBtn');
        const callStatus = document.getElementById('callStatus');

        // Initialize PeerJS
        function initPeer() {
            peer = new Peer({
                config: {
                    iceServers: [
                        { urls: 'stun:stun.l.google.com:19302' },
                        { urls: 'stun:stun1.l.google.com:19302' }
                    ]
                }
            });

            peer.on('open', (id) => {
                myPeerId.textContent = id;
                status.textContent = '✅ Ready! Share your Peer ID with friends.';
                status.className = 'status connected';
            });

            peer.on('error', (err) => {
                status.textContent = '❌ Connection error: ' + err.type;
                status.className = 'status error';
            });

            // Handle incoming calls
            peer.on('call', (call) => {
                navigator.mediaDevices.getUserMedia({
                    video: true,
                    audio: true
                }).then((stream) => {
                    localStream = stream;
                    localVideo.srcObject = stream;
                    
                    call.answer(stream);
                    handleCall(call);
                }).catch((err) => {
                    alert('Please allow camera/microphone access');
                });
            });
        }

        // Connect to a call
        async function connectCall() {
            const peerId = peerIdInput.value.trim();
            if (!peerId) {
                alert('Enter a Peer ID to call');
                return;
            }

            try {
                status.textContent = '🔄 Getting camera & mic access...';
                status.className = 'status connecting';

                localStream = await navigator.mediaDevices.getUserMedia({
                    video: true,
                    audio: true
                });

                localVideo.srcObject = localStream;
                currentCall = peer.call(peerId, localStream);

                handleCall(currentCall);
            } catch (err) {
                status.textContent = '❌ Camera/mic access denied';
                status.className = 'status error';
            }
        }

        // Handle call connection
        function handleCall(call) {
            currentCall = call;

            call.on('stream', (remoteStream) => {
                remoteVideo.srcObject = remoteStream;
                
                mainScreen.style.display = 'none';
                callScreen.classList.add('active');
                status.textContent = '🟢 Connected - You can see and hear each other!';
                callStatus.textContent = '🟢 Live call - High quality P2P connection';
            });

            call.on('close', endCall);
            call.on('error', (err) => {
                status.textContent = '❌ Call failed: ' + err;
                status.className = 'status error';
            });
        }

        // End current call
        function endCall() {
            if (currentCall) {
                currentCall.close();
            }
            if (localStream) {
                localStream.getTracks().forEach(track => track.stop());
            }
            
            localVideo.srcObject = null;
            remoteVideo.srcObject = null;
            callScreen.classList.remove('active');
            mainScreen.style.display = 'block';
            status.textContent = '✅ Call ended';
            status.className = 'status connected';
        }

        // Toggle mute
        function toggleMute() {
            const audioTrack = localStream.getAudioTracks()[0];
            isMuted = !isMuted;
            audioTrack.enabled = !isMuted;
            muteBtn.textContent = isMuted ? '🔊 Unmute' : '🔇 Mute';
            muteBtn.className = isMuted ? 'btn-success' : 'btn-danger';
        }

        // Toggle video
        function toggleVideo() {
            const videoTrack = localStream.getVideoTracks()[0];
            isVideoOn = !isVideoOn;
            videoTrack.enabled = isVideoOn;
        }

        // Copy peer ID to clipboard
        myPeerId.addEventListener('click', () => {
            navigator.clipboard.writeText(myPeerId.textContent).then(() => {
                const original = myPeerId.textContent;
                myPeerId.textContent = '✅ Copied to clipboard!';
                setTimeout(() => {
                    myPeerId.textContent = original;
                }, 2000);
            });
        });

        // Enter to connect
        peerIdInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') connectCall();
        });

        // Initialize on page load
        window.addEventListener('load', initPeer);
    </script>
</body>
</html>
