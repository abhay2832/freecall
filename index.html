<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Call Free</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://sdk.twilio.com/js/client/v1.14/twilio.min.js"></script>

    <style>
        :root {
            --primary: #007bff;
            --bg-light: #f4f7f6;
            --text-dark: #333;
            --danger: #ff3b30;
            --call-bg: #1c1c1e;
            --call-text: #ffffff;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-light);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }

        /* App Container */
        .screen {
            width: 100%;
            max-width: 400px;
            height: 100vh;
            max-height: 800px;
            background: #fff;
            display: none;
            flex-direction: column;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }

        .screen.active {
            display: flex;
        }

        /* Dialer Screen */
        #dialer-screen {
            padding: 40px 20px;
            align-items: center;
            justify-content: center;
        }

        .header {
            text-align: center;
            margin-bottom: 40px;
        }

        .header h1 {
            color: var(--primary);
            font-size: 2.5rem;
            margin-bottom: 10px;
        }

        .header p {
            color: #666;
        }

        .input-group {
            width: 100%;
            margin-bottom: 30px;
        }

        select, input {
            width: 100%;
            padding: 15px;
            margin-bottom: 15px;
            border: 1px solid #ddd;
            border-radius: 10px;
            font-size: 1.1rem;
            outline: none;
        }

        select:focus, input:focus {
            border-color: var(--primary);
        }

        .btn-primary {
            width: 100%;
            padding: 18px;
            background-color: #34c759;
            color: white;
            border: none;
            border-radius: 50px;
            font-size: 1.2rem;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
        }

        .btn-primary:hover {
            background-color: #2da94c;
        }

        /* Call Screen */
        #call-screen {
            background-color: var(--call-bg);
            color: var(--call-text);
            padding: 60px 20px;
            justify-content: space-between;
            align-items: center;
        }

        .call-info {
            text-align: center;
            margin-top: 40px;
        }

        #display-number {
            font-size: 2rem;
            font-weight: 300;
            margin-bottom: 10px;
        }

        #call-status {
            font-size: 1.2rem;
            color: #a1a1a6;
            margin-bottom: 5px;
        }

        #call-timer {
            font-size: 1.2rem;
            display: none;
        }

        .call-controls {
            display: flex;
            gap: 30px;
            margin-bottom: 40px;
        }

        .control-btn {
            background: rgba(255, 255, 255, 0.15);
            border: none;
            color: white;
            width: 70px;
            height: 70px;
            border-radius: 50%;
            font-size: 1.5rem;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: 0.3s;
        }

        .control-btn span {
            font-size: 0.7rem;
            margin-top: 5px;
        }

        .control-btn.active {
            background: #fff;
            color: var(--call-bg);
        }

        .btn-danger {
            background-color: var(--danger);
            color: white;
            border: none;
            width: 75px;
            height: 75px;
            border-radius: 50%;
            font-size: 2rem;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 40px;
            transition: 0.3s;
        }

        .btn-danger:hover {
            background-color: #cc2f26;
        }

        /* Desktop view styling */
        @media (min-width: 401px) {
            .screen {
                border-radius: 30px;
                height: 800px;
            }
        }
    </style>
</head>
<body>

    <div id="dialer-screen" class="screen active">
        <div class="header">
            <h1>Call Free</h1>
            <p>Make international calls from your browser</p>
        </div>
        
        <div class="input-group">
            <select id="country-code">
                <option value="+91">🇮🇳 India (+91)</option>
                <option value="+1">🇺🇸 USA (+1)</option>
                <option value="+92">🇵🇰 Pakistan (+92)</option>
                <option value="+977">🇳🇵 Nepal (+977)</option>
                <option value="+81">🇯🇵 Japan (+81)</option>
                <option value="+975">🇧🇹 Bhutan (+975)</option>
                <option value="+44">🇬🇧 UK (+44)</option>
                <option value="+61">🇦🇺 Australia (+61)</option>
                <option value="+1">🇨🇦 Canada (+1)</option>
                <option value="+49">🇩🇪 Germany (+49)</option>
            </select>
            <input type="tel" id="phone-number" placeholder="Enter phone number" autocomplete="off">
        </div>

        <button id="call-btn" class="btn-primary">
            <i class="fa-solid fa-phone"></i> Call
        </button>
    </div>

    <div id="call-screen" class="screen">
        <div class="call-info">
            <div id="display-number">+1 234 567 8900</div>
            <div id="call-status">Calling...</div>
            <div id="call-timer">00:00</div>
        </div>

        <div class="call-controls">
            <button id="mute-btn" class="control-btn">
                <i class="fa-solid fa-microphone"></i>
                <span>Mute</span>
            </button>
            <button id="speaker-btn" class="control-btn">
                <i class="fa-solid fa-volume-high"></i>
                <span>Speaker</span>
            </button>
        </div>

        <button id="end-call-btn" class="btn-danger">
            <i class="fa-solid fa-phone-slash"></i>
        </button>
    </div>

    <script>
        // DOM Elements
        const dialerScreen = document.getElementById('dialer-screen');
        const callScreen = document.getElementById('call-screen');
        const countryCode = document.getElementById('country-code');
        const phoneNumber = document.getElementById('phone-number');
        const callBtn = document.getElementById('call-btn');

        const displayNumber = document.getElementById('display-number');
        const callStatus = document.getElementById('call-status');
        const callTimer = document.getElementById('call-timer');
        const muteBtn = document.getElementById('mute-btn');
        const speakerBtn = document.getElementById('speaker-btn');
        const endCallBtn = document.getElementById('end-call-btn');

        // State variables
        let timerInterval;
        let seconds = 0;
        let isMuted = false;
        let isSpeakerOn = false;

        // UI EVENT LISTENERS
        callBtn.addEventListener('click', () => {
            const number = phoneNumber.value.trim();
            if (!number) {
                alert("Please enter a phone number.");
                return;
            }
            const fullNumber = countryCode.value + " " + number;
            startUI_Call(fullNumber);
        });

        endCallBtn.addEventListener('click', () => {
            endUI_Call();
        });

        muteBtn.addEventListener('click', () => {
            isMuted = !isMuted;
            muteBtn.classList.toggle('active');
        });

        speakerBtn.addEventListener('click', () => {
            isSpeakerOn = !isSpeakerOn;
            speakerBtn.classList.toggle('active');
        });

        // UI LOGIC FUNCTIONS
        function startUI_Call(number) {
            // Switch screens
            dialerScreen.classList.remove('active');
            callScreen.classList.add('active');
            
            // Reset UI
            displayNumber.textContent = number;
            callStatus.textContent = "Calling...";
            callTimer.style.display = "none";
            muteBtn.classList.remove('active');
            speakerBtn.classList.remove('active');
            seconds = 0;

            // Simulate connection after 2 seconds
            setTimeout(() => {
                callStatus.textContent = "Connected";
                callTimer.style.display = "block";
                startTimer();
            }, 2000); 
        }

        function endUI_Call() {
            clearInterval(timerInterval);
            callStatus.textContent = "Call Ended";
            
            setTimeout(() => {
                callScreen.classList.remove('active');
                dialerScreen.classList.add('active');
                phoneNumber.value = ''; // clear input
            }, 1500);
        }

        function startTimer() {
            clearInterval(timerInterval);
            callTimer.textContent = "00:00";
            timerInterval = setInterval(() => {
                seconds++;
                const mins = String(Math.floor(seconds / 60)).padStart(2, '0');
                const secs = String(seconds % 60).padStart(2, '0');
                callTimer.textContent = `${mins}:${secs}`;
            }, 1000);
        }
    </script>
</body>
</html>
